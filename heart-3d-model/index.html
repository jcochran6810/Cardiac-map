<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart Model - Cardiac Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #e0e0e0;
            background: rgba(0, 0, 0, 0.7);
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid rgba(200, 50, 50, 0.4);
            max-width: 320px;
            pointer-events: none;
        }
        #info-panel h1 {
            font-size: 20px;
            color: #ff6b6b;
            margin-bottom: 8px;
        }
        #info-panel p {
            font-size: 13px;
            line-height: 1.5;
            color: #bbb;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        #controls button {
            background: rgba(200, 50, 50, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 100, 100, 0.5);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            pointer-events: all;
        }
        #controls button:hover {
            background: rgba(220, 60, 60, 0.85);
        }
        #controls button.active {
            background: rgba(220, 60, 60, 0.9);
            border-color: #ff8888;
        }
        #label-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .anatomy-label {
            position: absolute;
            color: #fff;
            font-size: 12px;
            background: rgba(0,0,0,0.65);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,100,100,0.4);
            white-space: nowrap;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="info-panel">
        <h1>3D Heart Model</h1>
        <p>Interactive anatomical heart. Drag to rotate, scroll to zoom. Click anatomy buttons to highlight chambers and vessels.</p>
    </div>
    <div id="controls">
        <button id="btn-beat" class="active">Heartbeat</button>
        <button id="btn-chambers">Chambers</button>
        <button id="btn-vessels">Vessels</button>
        <button id="btn-valves">Valves</button>
        <button id="btn-reset">Reset View</button>
    </div>
    <div id="label-overlay"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="heart.js"></script>
</body>
</html>
